# Install in the host Nginx vhost directory. Supply this domain's TLS certificate.
server {
    listen 80;
    server_name admin-api.omini.cn;
    location /.well-known/acme-challenge/ { root /var/www/omini-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin-api.omini.cn;

    # This server already has a Cloudflare Origin CA wildcard certificate.
    # Cloudflare must proxy the domain with Full (strict) TLS.
    ssl_certificate /www/server/panel/vhost/cert/omini.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/omini.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    access_log /www/wwwlogs/admin-api.omini.cn.log;
    error_log /www/wwwlogs/admin-api.omini.cn.error.log;
}
