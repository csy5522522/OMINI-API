# Install as /etc/nginx/sites-available/admin-api.omini.xin.conf and enable it.
server {
    listen 80;
    server_name admin-api.omini.xin;
    location /.well-known/acme-challenge/ { root /var/www/omini-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name admin-api.omini.xin;

    ssl_certificate /etc/letsencrypt/live/admin-api.omini.xin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin-api.omini.xin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    access_log /var/log/nginx/admin-api.omini.xin.access.log;
    error_log /var/log/nginx/admin-api.omini.xin.error.log;
}
